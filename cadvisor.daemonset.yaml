# Deploy a cAdvisor pod on each node of the cluster to monitor containers
apiVersion: apps/v1
kind: DaemonSet # Deploy one pod per node automatically
metadata:
  name: cadvisor
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: cadvisor # Label used to find DaemonSet pods
# Pod template
  template:
    metadata:
      labels:
        app: cadvisor
# cAdvisor container definition
    spec:
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:latest
          ports:
            - containerPort: 8080 # Web interface on port 8080
# Volumes definition -> give read rights to the host node system directories to be able to monitor containers
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: var-run
              mountPath: /var/run
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: docker
              mountPath: /var/lib/docker
              readOnly: true
            # Add a volumeMount for cgroup
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
# Restart and volumes
      restartPolicy: Always # Auto restart
      volumes: # Mount volumes
        - name: rootfs
          hostPath:
            path: /
        - name: var-run
          hostPath:
            path: /var/run
        - name: sys
          hostPath:
            path: /sys
        - name: docker
          hostPath:
            path: /var/lib/docker
        # Add a volumes entry for cgroup
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory