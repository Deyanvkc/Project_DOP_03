# Version de l'API
apiVersion: v1
# Création du secret -> stockage de données sensibles
kind: Secret
# Bloc contenant les infos d'identité du secret
metadata:
  name: postgres-secret
  namespace: default
# Opaque -> type de secret: secret générique
type: Opaque
# Bloc de valeurs sensibles
data:
  POSTGRES_USER: cG9zdGdyZXM=          # postgres encodé en base64
  POSTGRES_PASSWORD: c2VjdXJpc2U=  # securise encodé en base64
